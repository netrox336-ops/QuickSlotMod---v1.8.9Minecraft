name: Публикация релиза

on:
  push:
    branches: ["main"]
    paths:
      - "gradle.properties"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.3"

      - name: Узнать версию
        id: version
        run: echo "version=$(grep '^modVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Собрать QuickSlot
        run: gradle build --stacktrace

      - name: Подготовить jar
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n 1)
          test -n "$JAR"
          cp "$JAR" "QuickSlot-v${VERSION}-Minecraft-1.8.9.jar"

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: QuickSlot v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES_v${{ steps.version.outputs.version }}.md
          files: QuickSlot-v${{ steps.version.outputs.version }}-Minecraft-1.8.9.jar
          fail_on_unmatched_files: true
