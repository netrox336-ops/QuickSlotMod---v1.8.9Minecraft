name: Сборка

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.3"

      - name: Узнать версию
        id: version
        run: echo "version=$(grep '^modVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Собрать мод
        run: gradle build --stacktrace

      - name: Сохранить jar
        uses: actions/upload-artifact@v4
        with:
          name: QuickSlot-${{ steps.version.outputs.version }}
          path: build/libs/*.jar
